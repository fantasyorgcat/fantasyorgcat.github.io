name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [nba-report-ready]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Dispatch checks current main against its exact generated report SHA.
          ref: ${{ github.event_name == 'repository_dispatch' && 'main' || github.sha }}
      - name: Verify dispatch report and successful upstream run
        if: github.event_name == 'repository_dispatch'
        run: python validate_dispatch.py
      - name: Stage only public website files
        run: |
          python security_gate.py --stage _site
          git rev-parse HEAD
          sha256sum _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
