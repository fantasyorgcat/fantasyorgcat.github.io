name: Daily NBA Fantasy Update
on:
  schedule:
    # Run at 08:17 UTC daily (16:17 Taiwan); avoid the busy start of the hour.
    - cron: '17 8 * * *'
    # Temporary acceptance slot: 2026-10-03 13:17 UTC. Remove by 14:17 UTC.
    # Cron has no year field; this must be removed after the acceptance window.
    - cron: '17 13 3 10 *'
  workflow_dispatch: # Allows manual trigger
permissions:
  contents: write
concurrency:
  group: daily-report
  cancel-in-progress: false
jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main' && github.repository == 'fantasyorgcat/fantasyorgcat.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      report_sha: ${{ steps.report.outputs.report_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Generate Report
        run: |
          python -m unittest test_sources test_defense test_schedule test_player_catalog
          python generate_report.py
      - name: Validate generated public report
        run: python security_gate.py --generated
      - name: Prepare for Deployment
        id: report
        run: |
          # Rename the output to index.html so it serves as the homepage
          mv fantasy_nba_report_v2.html index.html
          
          # Configure git
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # Commit and Push
          git add index.html data_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "Daily Update: $(date +'%Y-%m-%d')"
          fi
          git push origin HEAD:main
          echo "report_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "### NBA report evidence"
            echo "Event: $GITHUB_EVENT_NAME"
            echo "Run: $GITHUB_RUN_ID / attempt $GITHUB_RUN_ATTEMPT"
            echo "Report commit: $(git rev-parse HEAD)"
            echo '```'
            sha256sum index.html data_snapshot.json
            python -c "import json; d=json.load(open('data_snapshot.json')); print(json.dumps({k:d.get(k) for k in ['generated_at','schedule','period_populations','roster_players','current_stats_last_game']}, indent=2))"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: build-and-deploy
    if: >-
      needs.build-and-deploy.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'fantasyorgcat/fantasyorgcat.github.io'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-deploy.outputs.report_sha }}
      - name: Validate and stage the exact generated report
        run: |
          python security_gate.py --stage _site
          git rev-parse HEAD
          sha256sum _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
